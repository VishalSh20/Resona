; Minimal PJSIP endpoint for local SIP testing.
; LiveKit dials sip:agent@127.0.0.1:5062, authenticating as agent/secret.
; 5062 (not 5060) because livekit-sip owns 5060 on the host.
;
; res_pjsip identifies an inbound request by the *From* user, and LiveKit's From
; user is the caller ID (+91...), not "agent" — so match the endpoint by source
; IP instead (identify), then digest-auth against the auth object.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5062

[agent]
type=endpoint
context=local-test
disallow=all
allow=ulaw
allow=alaw
auth=agent-auth
aors=agent
direct_media=no

[agent-auth]
type=auth
auth_type=userpass
username=agent
password=secret

[agent]
type=aor
max_contacts=5

[agent-identify]
type=identify
endpoint=agent
match=127.0.0.1
