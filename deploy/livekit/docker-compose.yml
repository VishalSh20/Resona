# Self-hosted LiveKit + SIP telephony for the VoiceEval caller (local/dev).
#
#   # 1. backend infra (postgres, redis, minio) — the SIP server reuses redis:
#   docker compose -f backend/docker-compose.yml up -d postgres redis minio
#   # 2. LiveKit server + SIP telephony service:
#   docker compose -f deploy/livekit/docker-compose.yml up -d
#
# Both services use host networking (matching LiveKit's own SIP compose) so the
# SIP server can advertise a reachable address for RTP. On a laptop that means
# loopback: dialing a *local* SIP endpoint works, but reaching Exotel/PSTN needs
# a public IP (or LiveKit Cloud) — see deploy/livekit/README.md.
#
# The API key/secret in livekit.yaml must match backend/.env:
#   LIVEKIT_URL=ws://localhost:7880
#   LIVEKIT_API_KEY=<key>   (also inlined below for the SIP service)
#   LIVEKIT_API_SECRET=<secret>
services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: voiceeval-livekit
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # SIP telephony (make/receive calls). Configured via SIP_CONFIG_BODY so the
  # key/secret stay in lock-step with livekit.yaml.
  sip:
    image: livekit/sip:latest
    container_name: voiceeval-livekit-sip
    restart: unless-stopped
    network_mode: host
    depends_on:
      - livekit
    environment:
      SIP_CONFIG_BODY: |
        api_key: 'LKc646c4abbf72'
        api_secret: 'hWRSObUtC4SMk0ixRMzNg6C6dnZE4oBC'
        ws_url: 'ws://localhost:7880'
        redis:
          address: 'localhost:6379'
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: false
        logging:
          level: debug

  # Local SIP test endpoint (Asterisk). Answers and plays audio so the SIP path
  # can be exercised end-to-end without a carrier. Dial: sip:agent@127.0.0.1:5062
  # (digest user agent / secret). 5062 avoids livekit-sip's 5060 on the host.
  asterisk:
    image: andrius/asterisk:latest
    container_name: voiceeval-asterisk
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
